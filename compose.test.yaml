# A separate disposable PostgreSQL server; never points at the app database.
services:
  mailpit:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
    tmpfs:
      - /data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starter_test
      POSTGRES_PASSWORD: ${STARTER_TEST_PASSWORD:?Run npm test or npm run test:e2e}
      POSTGRES_DB: starter_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_test -d starter_test"]
      interval: 1s
      timeout: 5s
      retries: 30
